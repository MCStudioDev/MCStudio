<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="300" cy="300" r="300" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Face placeholder -->
  <circle cx="300" cy="250" r="120" fill="rgba(255,255,255,0.9)" />
  
  <!-- Eyes -->
  <ellipse cx="270" cy="230" rx="15" ry="8" fill="#333" />
  <ellipse cx="330" cy="230" rx="15" ry="8" fill="#333" />
  
  <!-- Smile -->
  <path d="M 260 270 Q 300 300 340 270" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <!-- Professional elements -->
  <rect x="220" y="320" width="160" height="60" rx="30" fill="rgba(255,255,255,0.8)" />
  <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333" font-weight="600">Mina Naguib</text>
  
  <!-- Title -->
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Energy Storage Consultant</text>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <circle cx="150" cy="150" r="20" fill="white" />
    <circle cx="450" cy="150" r="15" fill="white" />
    <circle cx="150" cy="450" r="25" fill="white" />
    <circle cx="450" cy="450" r="18" fill="white" />
  </g>
  
  <!-- Technology icons -->
  <g opacity="0.5">
    <path d="M 100 100 L 140 100 L 140 140 L 100 140 Z" fill="white" />
    <path d="M 460 100 L 500 100 L 500 140 L 460 140 Z" fill="white" />
    <path d="M 100 460 L 140 460 L 140 500 L 100 500 Z" fill="white" />
    <path d="M 460 460 L 500 460 L 500 500 L 460 500 Z" fill="white" />
  </g>
</svg>