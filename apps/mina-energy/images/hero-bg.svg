<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#grad1)" />
  
  <!-- Floating elements -->
  <circle cx="200" cy="200" r="80" fill="rgba(255,255,255,0.1)" />
  <circle cx="1600" cy="400" r="60" fill="rgba(255,255,255,0.1)" />
  <circle cx="800" cy="800" r="100" fill="rgba(255,255,255,0.1)" />
  <circle cx="1200" cy="200" r="40" fill="rgba(255,255,255,0.1)" />
  
  <!-- Energy grid pattern -->
  <g opacity="0.3">
    <line x1="0" y1="200" x2="1920" y2="200" stroke="white" stroke-width="2" />
    <line x1="0" y1="400" x2="1920" y2="400" stroke="white" stroke-width="2" />
    <line x1="0" y1="600" x2="1920" y2="600" stroke="white" stroke-width="2" />
    <line x1="0" y1="800" x2="1920" y2="800" stroke="white" stroke-width="2" />
    
    <line x1="200" y1="0" x2="200" y2="1080" stroke="white" stroke-width="2" />
    <line x1="600" y1="0" x2="600" y2="1080" stroke="white" stroke-width="2" />
    <line x1="1000" y1="0" x2="1000" y2="1080" stroke="white" stroke-width="2" />
    <line x1="1400" y1="0" x2="1400" y2="1080" stroke="white" stroke-width="2" />
  </g>
  
  <!-- Battery icon cluster -->
  <g transform="translate(1500, 700)">
    <rect x="0" y="0" width="80" height="120" rx="10" fill="rgba(255,255,255,0.2)" />
    <rect x="90" y="40" width="20" height="40" fill="rgba(255,255,255,0.4)" />
    
    <rect x="200" y="20" width="60" height="100" rx="8" fill="rgba(255,255,255,0.2)" />
    <rect x="270" y="55" width="15" height="30" fill="rgba(255,255,255,0.4)" />
    
    <rect x="350" y="60" width="40" height="80" rx="6" fill="rgba(255,255,255,0.2)" />
    <rect x="400" y="90" width="10" height="20" fill="rgba(255,255,255,0.4)" />
  </g>
  
  <!-- Technology patterns -->
  <g opacity="0.1">
    <circle cx="400" cy="100" r="150" fill="white" filter="url(#blur)" />
    <circle cx="1200" cy="900" r="200" fill="white" filter="url(#blur)" />
    <circle cx="800" cy="540" r="100" fill="white" filter="url(#blur)" />
  </g>
  
  <!-- Subtle texture -->
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="white" opacity="0.1" />
  </pattern>
  <rect width="1920" height="1080" fill="url(#dots)" />
</svg>